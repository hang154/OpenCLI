name: Build Aside Android debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'mobile-aside/**'
    paths:
      - 'mobile-aside-mvp/**'
      - '.github/workflows/android-debug-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          cd mobile-aside-mvp
          gradle --no-daemon :app:assembleDebug
      - name: Verify package and checksums
        run: |
          find mobile-aside-mvp/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print
          sha256sum mobile-aside-mvp/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aside-Mobile-Debug-APK
          path: mobile-aside-mvp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
